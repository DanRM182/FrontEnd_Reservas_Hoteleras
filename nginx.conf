server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Plantilla procesada por la imagen oficial de Nginx al arrancar.
    # Conservar la ruta completa: el gateway aplica StripPrefix=2.
    location ~ ^/api/(habitaciones|huespedes|reservas)(?:/|$) {
        proxy_pass ${GATEWAY_URL};
        proxy_set_header Host $proxy_host;
    }

    location ~ ^/auth-api(?:/|$) {
        rewrite ^/auth-api/?(.*)$ /$1 break;
        proxy_pass ${AUTH_URL};
        proxy_set_header Host $proxy_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
