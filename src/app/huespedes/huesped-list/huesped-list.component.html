<mat-toolbar color="primary" class="encabezado">
  <span>Huéspedes</span>
  <span class="spacer"></span>
  <button mat-icon-button (click)="buscar()" [disabled]="cargando || eliminandoId !== null" matTooltip="Actualizar listado" aria-label="Actualizar listado">
    <mat-icon>refresh</mat-icon>
  </button>
  <button mat-raised-button color="accent" (click)="abrirFormulario()" [disabled]="eliminandoId !== null">
    <mat-icon>add</mat-icon> Nuevo huésped
  </button>
</mat-toolbar>
<div class="loading" *ngIf="cargando" role="status" aria-label="Cargando huespedes">
  <mat-spinner diameter="40"></mat-spinner>
</div>
<div class="error" *ngIf="error && !cargando" role="alert">
  <p>{{ error }}</p>
  <button mat-button color="primary" (click)="buscar()">Reintentar</button>
</div>
<div class="tabla-contenedor" *ngIf="!cargando && !error && registros.length">
  <table mat-table [dataSource]="registros" class="mat-elevation-z2">
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre completo</th>
      <td mat-cell *matCellDef="let registro">{{ registro.nombre }}</td>
    </ng-container>
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Correo</th>
      <td mat-cell *matCellDef="let registro">{{ registro.email }}</td>
    </ng-container>
    <ng-container matColumnDef="telefono">
      <th mat-header-cell *matHeaderCellDef>Teléfono</th>
      <td mat-cell *matCellDef="let registro">{{ registro.telefono }}</td>
    </ng-container>
    <ng-container matColumnDef="documento">
      <th mat-header-cell *matHeaderCellDef>Documento</th>
      <td mat-cell *matCellDef="let registro">{{ registro.documento }}</td>
    </ng-container>
    <ng-container matColumnDef="nacionalidad">
      <th mat-header-cell *matHeaderCellDef>Nacionalidad</th>
      <td mat-cell *matCellDef="let registro">{{ registro.nacionalidad }}</td>
    </ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let registro" class="acciones">
        <button mat-icon-button color="primary" (click)="abrirFormulario(registro)" [disabled]="eliminandoId !== null"
          matTooltip="Editar" [attr.aria-label]="'Editar ' + registro.nombre"><mat-icon>edit</mat-icon></button>

        <span [matTooltip]="'Eliminar'">
          <button mat-icon-button color="warn" (click)="eliminar(registro)" [disabled]="eliminandoId !== null"
            [attr.aria-label]="'Eliminar ' + registro.nombre"><mat-icon>delete</mat-icon></button>
        </span>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas"></tr>
  </table>
</div>
<p class="sin-datos" *ngIf="!cargando && !error && !registros.length">No hay huespedes registrados.</p>
