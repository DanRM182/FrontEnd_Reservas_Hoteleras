<h2 mat-dialog-title>Estado de habitación {{ data.numeroHabitacion }}</h2>
<mat-dialog-content>
  <p class="ayuda">Estado actual: {{ data.estadoHabitacion }}. La ocupación se realiza mediante una reserva.</p>
  <p *ngIf="estaOcupada(data)" class="ayuda">Gestiona la ocupación desde la reserva antes de cambiar manualmente el estado.</p>
  <mat-form-field appearance="outline">
    <mat-label>Estado</mat-label>
    <mat-select [formControl]="estado">
      <mat-option *ngFor="let opcion of estados" [value]="opcion.id"
        [disabled]="guardando || !permitido(opcion.id)">
        {{ opcion.descripcion }}
      </mat-option>
    </mat-select>
  </mat-form-field>
  <p *ngIf="error" class="error" role="alert">{{ error }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false" [disabled]="guardando">Cancelar</button>
  <button mat-raised-button color="primary" (click)="guardar()" [disabled]="guardando || estado.invalid || !permitido(estado.value)">
    {{ guardando ? 'Guardando...' : 'Guardar' }}
  </button>
</mat-dialog-actions>
